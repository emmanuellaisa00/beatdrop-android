name: Build & Deploy BeatDrop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Grant gradlew permission
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare install signing key
        run: |
          set -euo pipefail
          STORE="$RUNNER_TEMP/beatdrop-install.keystore"
          STOREPASS="${KEYSTORE_PASSWORD_SECRET:-android}"
          ALIAS="${KEY_ALIAS_SECRET:-beatdrop}"
          KEYPASS="${KEY_PASSWORD_SECRET:-android}"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$STORE"
          else
            keytool -genkeypair \
              -keystore "$STORE" \
              -storepass "$STOREPASS" \
              -keypass "$KEYPASS" \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=BeatDrop, OU=Android, O=BeatDrop, L=Nairobi, ST=Nairobi, C=KE"
          fi

          cat > keystore.properties <<EOF
          storeFile=$STORE
          storePassword=$STOREPASS
          keyAlias=$ALIAS
          keyPassword=$KEYPASS
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK signature and manifest
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -30

      - name: Gather single APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/BeatDrop.apk
          ls -lh dist
          sha256sum dist/BeatDrop.apk > dist/BeatDrop.apk.sha256
          cat dist/BeatDrop.apk.sha256

      - name: Upload single APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatDrop-apk
          path: dist/BeatDrop.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BeatDrop Android build ${{ github.run_number }}
          body: |
            BeatDrop Android v1.0.2 — build ${{ github.run_number }}
            Commit: ${{ github.sha }}

            Download and install `BeatDrop.apk`. The Actions artifact ZIP contains exactly one APK.
          files: |
            dist/BeatDrop.apk
            dist/BeatDrop.apk.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
