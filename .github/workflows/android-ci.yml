name: Build & Deploy BeatDrop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      HAS_RELEASE_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Grant gradlew permission
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build Android-13-compatible release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: ${{ github.event_name != 'pull_request' && secrets.KEYSTORE_BASE64 != '' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Note missing release keystore
        if: github.event_name != 'pull_request' && env.HAS_RELEASE_KEYSTORE != 'true'
        run: echo "No release keystore secret is configured. The workflow will publish the pinned phone-install APK instead of a newly built release APK."

      - name: Verify APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | head -30

      - name: Reject debug-signed release APKs
        if: github.event_name != 'pull_request' && env.HAS_RELEASE_KEYSTORE == 'true'
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          CERT_INFO=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK")
          echo "$CERT_INFO"
          if echo "$CERT_INFO" | grep -q "Android Debug"; then
            echo "Refusing to publish a debug-signed release APK"
            exit 1
          fi

      - name: Gather single APK
        run: |
          mkdir -p dist
          if [ "$HAS_RELEASE_KEYSTORE" = "true" ]; then
            cp app/build/outputs/apk/release/*.apk dist/BeatDrop-build-${{ github.run_number }}.apk
            echo "fresh release-signed APK built from this workflow run" > dist/BeatDrop-build-${{ github.run_number }}.apk.source.txt
          else
            cp phone-install/BeatDrop.apk dist/BeatDrop-build-${{ github.run_number }}.apk
            echo "pinned known-stable phone-install APK reused because no release keystore is configured" > dist/BeatDrop-build-${{ github.run_number }}.apk.source.txt
          fi
          ls -lh dist
          sha256sum dist/BeatDrop-build-${{ github.run_number }}.apk > dist/BeatDrop-build-${{ github.run_number }}.apk.sha256
          cat dist/BeatDrop-build-${{ github.run_number }}.apk.sha256
          cat dist/BeatDrop-build-${{ github.run_number }}.apk.source.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatDrop-apk
          path: |
            dist/BeatDrop-build-${{ github.run_number }}.apk
            dist/BeatDrop-build-${{ github.run_number }}.apk.sha256
            dist/BeatDrop-build-${{ github.run_number }}.apk.source.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BeatDrop Android 13 compatible build ${{ github.run_number }}
          body: |
            BeatDrop Android 13 compatible APK — build ${{ github.run_number }}
            Commit: ${{ github.sha }}

            This workflow refuses to publish a newly built debug-signed release APK.
            If a release keystore is configured, the attached `BeatDrop-build-${{ github.run_number }}.apk` is newly built from this commit.
            If no release keystore is configured, the attached `BeatDrop-build-${{ github.run_number }}.apk` is the pinned known-stable `phone-install/BeatDrop.apk` fallback.
          files: |
            dist/BeatDrop-build-${{ github.run_number }}.apk
            dist/BeatDrop-build-${{ github.run_number }}.apk.sha256
            dist/BeatDrop-build-${{ github.run_number }}.apk.source.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
